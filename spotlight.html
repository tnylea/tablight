<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Spotlight</title>
  <style>
    html { color-scheme: light dark; background: linear-gradient(135deg, #cfe0f2 0%, #e6edf6 55%, #d6e3f1 100%); min-height: 100%; }
    @media (prefers-color-scheme: dark) { html { background: linear-gradient(135deg, #0f1826 0%, #182436 55%, #10192a 100%); } }
    html[data-theme="light"] { color-scheme: light; background: linear-gradient(135deg, #cfe0f2 0%, #e6edf6 55%, #d6e3f1 100%); }
    html[data-theme="dark"] { color-scheme: dark; background: linear-gradient(135deg, #0f1826 0%, #182436 55%, #10192a 100%); }
    body { margin: 0; }
  </style>
</head>
<body>
  <script src="spotlight-core.js"></script>
  <script src="spotlight-page.js"></script>
</body>
</html>
