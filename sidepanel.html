<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Thumbnails</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="header">
    <span class="header-title">Tabs</span>
    <span class="header-count" id="tab-count"></span>
    <button id="fill-btn" class="header-action" type="button" title="Generate thumbnails for tabs that don't have one yet. Briefly shows each tab without a screenshot so it can be captured.">Capture all</button>
  </header>
  <div id="notice" class="notice" hidden></div>
  <main id="tab-list" class="tab-list"></main>
  <div id="hover-preview" class="hover-preview" hidden>
    <img id="hover-preview-img" alt="">
    <div id="hover-preview-title"></div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
